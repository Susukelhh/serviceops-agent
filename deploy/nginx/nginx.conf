# Nginx 自动选择适合容器 CPU 配额的工作进程数。
worker_processes auto;
# 根文件系统只读，所以 PID 文件必须放在可写的 /tmp 内存目录。
pid /tmp/nginx.pid;
# 错误日志写到容器标准错误，Docker 可以统一收集，不写本地日志文件。
error_log /dev/stderr notice;

events {
    # 本地演练 1024 个并发连接足够；生产值需要结合压测和系统限制计算。
    worker_connections 1024;
}

http {
    # 复用官方 MIME 映射，保证 /docs 等静态资源类型正确。
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志只记录请求行、状态和后端地址，不记录 Authorization 或请求正文。
    log_format serviceops '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          'upstream=$upstream_addr upstream_status=$upstream_status '
                          'rate_limit=$limit_req_status conn_limit=$limit_conn_status';
    access_log /dev/stdout serviceops;

    # Nginx 的临时文件也放在只读根文件系统之外。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    # 即使当前没有使用 FastCGI/uWSGI/SCGI，Nginx 启动时也会初始化其默认目录。
    # 全部指向 /tmp，才能在保留只读根目录的同时稳定启动。
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Agent 的聊天请求不应携带大文件，入口先限制异常请求体。
    client_max_body_size 1m;
    sendfile on;
    keepalive_timeout 30s;

    # Docker 内置 DNS 会在容器重建、IP 变化后重新解析 agent-a/agent-b。
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 每个来源地址平均每秒最多发起 5 个业务请求，并允许短时 10 个突发请求。
    # 10MB 共享区由 Nginx worker 共同使用，不会因多 worker 分别计数而放大额度。
    limit_req_zone $binary_remote_addr zone=serviceops_api_rate:10m rate=5r/s;
    # 匿名会话签发单独按来源限制为每分钟30次，避免攻击者高速制造短期 Token。
    limit_req_zone $binary_remote_addr zone=serviceops_demo_session_rate:10m rate=30r/m;
    # 同一来源最多同时占用 20 个正在处理的业务连接，防止慢客户端长期占满入口。
    limit_conn_zone $binary_remote_addr zone=serviceops_api_connections:10m;

    # upstream 是两只 Agent 组成的后端小组；默认策略为轮询。
    upstream serviceops_backend {
        # 共享内存区让工作进程共享后端状态，并支持运行期重新解析服务名。
        zone serviceops_backend 64k;
        # resolve 避免某个 Agent 重建后 Nginx 仍记住旧容器 IP。
        server agent-a:8000 resolve max_fails=2 fail_timeout=5s;
        server agent-b:8000 resolve max_fails=2 fail_timeout=5s;
        # 复用到后端的 TCP 连接，减少每次请求都重新握手的开销。
        keepalive 16;
    }

    server {
        # 使用 8080 允许 Nginx 以非 root 用户监听端口。
        listen 8080;
        server_name _;

        # 入口拒绝使用明确 429，而不是 Nginx 默认 503，便于客户端区分“过快”和“后端故障”。
        limit_req_status 429;
        limit_conn_status 429;
        # 429 是预期削峰而非系统错误，使用 notice 便于统计且避免污染 ERROR 告警。
        limit_req_log_level notice;
        limit_conn_log_level notice;
        # 速率或连接超过上限时统一转成固定 JSON，不返回默认 HTML 错误页。
        error_page 429 = @gateway_overloaded;

        # 匿名入口只负责签发短时沙盒身份，使用比普通业务更严格的独立速率边界。
        location = /api/v1/demo/session {
            limit_req zone=serviceops_demo_session_rate burst=10 nodelay;
            limit_conn serviceops_api_connections 10;
            proxy_pass http://serviceops_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-ServiceOps-Gateway nginx always;
        }

        # /api/ 是可能执行 Agent、审批、审计或补偿的业务区域，应用两种入口保护。
        location /api/ {
            # nodelay 允许十个短突发立即处理，超过 burst 的请求直接进入 429。
            limit_req zone=serviceops_api_rate burst=10 nodelay;
            # 同一来源地址最多同时处理 20 个业务请求。
            limit_conn serviceops_api_connections 20;
            # 下面的代理边界与普通 location 保持一致。
            proxy_pass http://serviceops_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 130s;
            proxy_read_timeout 130s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-ServiceOps-Gateway nginx always;
        }

        location / {
            # 所有 API、健康检查和 Swagger 请求都交给后端 Agent。
            proxy_pass http://serviceops_backend;
            proxy_http_version 1.1;
            # 清空 Connection 头，配合 upstream keepalive 复用连接。
            proxy_set_header Connection "";
            # 传递原始主机和来源信息，为将来的审计、限流与 HTTPS 留接口。
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 建连应快速失败；聊天推理则允许最多约两分钟。
            proxy_connect_timeout 5s;
            proxy_send_timeout 130s;
            proxy_read_timeout 130s;
            # 当前后端在连接/网关错误时可尝试另一实例；不会对普通 4xx 重试。
            proxy_next_upstream error timeout http_502 http_503 http_504;
            # 该响应头证明请求确实经过了统一入口。
            add_header X-ServiceOps-Gateway nginx always;
        }

        # named location 不能被外部直接访问，只接收上面 error_page 的内部跳转。
        location @gateway_overloaded {
            internal;
            # 固定 JSON 与 Retry-After 不包含客户端地址、当前计数或其他内部细节。
            default_type application/json;
            add_header Retry-After 1 always;
            add_header X-ServiceOps-Gateway nginx always;
            add_header X-ServiceOps-Overload rate_or_connection always;
            return 429 '{"detail":"请求过于频繁，请稍后重试"}';
        }
    }
}
