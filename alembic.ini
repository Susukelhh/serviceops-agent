# Alembic 只管理 ServiceOps 自己的业务表；LangGraph Checkpoint 表由官方 Saver 管理。
[alembic]
# 迁移脚本随 serviceops_agent Python 包发布，源码和容器使用同一份版本历史。
script_location = src/serviceops_agent/migrations
# DSN 不写入配置文件；env.py 只从 SERVICEOPS_POSTGRES_DSN 或程序化配置读取。
sqlalchemy.url =

# 日志保持有限输出，不打印 SQL 参数和数据库连接密码。
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
